  - [[-1, -2, 7], 1, Concat, [1]]              # 17
  - [-1, 2, RepHMS, [256, 2, 1, 3, 7]]         # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [2, 1, AVG, []]                             # 20
  - [[-1, -2, 4], 1, Concat, [1]]              # 21
  - [-1, 2, RepHMS, [256, 2, 1, 3, 5]]         # 22

  - [[19, -1], 1, Concat, [1]]                 # 23
  - [-1, 2, RepHMS, [256, 2, 1, 3, 5]]         # 24

  - [22, 1, Conv, [256, 3, 2]]                 # 25
  - [24, 1, AVG, []]                             # 26
  - [[-1, -2, 18, 15], 1, Concat, [1]]         # 27
