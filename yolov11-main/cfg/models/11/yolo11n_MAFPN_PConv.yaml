# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11n + MAFPN + PConv
# 9-class maize leaf disease detection

nc: 9

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]


# YOLO11n Backbone + PConv
backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4

  # C3k2 -> C3k2_partconv
  - [-1, 2, C3k2_partconv, [256, False, 0.25]]   # 2

  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8

  # C3k2 -> C3k2_partconv
  - [-1, 2, C3k2_partconv, [512, False, 0.25]]   # 4

  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16

  # C3k2 -> C3k2_partconv
  - [-1, 2, C3k2_partconv, [512, True]]          # 6

  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32

  # C3k2 -> C3k2_partconv
  - [-1, 2, C3k2_partconv, [1024, True]]          # 8

  - [-1, 2, SPPF, [1024, 5]]                     # 9
  - [-1, 2, C2PSA, [1024]]                       # 10


# YOLO11n Head - MAFPN
head:

  # P5
  - [6, 1, AVG, []]                              # 11
  - [[-1, 10], 1, Concat, [1]]                   # 12
  - [-1, 2, RepHMS, [256, 2, 1, 3, 9]]          # 13

  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [4, 1, AVG, []]                              # 15
  - [[-1, -2, 6], 1, Concat, [1]]               # 16
  - [-1, 2, RepHMS, [256, 2, 1, 3, 7]]          # 17

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [2, 1, AVG, []]                              # 19
  - [[-1, -2, 4], 1, Concat, [1]]               # 20
  - [-1, 2, RepHMS, [256, 2, 1, 3, 5]]          # 21

  # P3 refinement
  - [[18, -1], 1, Concat, [1]]                   # 22
  - [-1, 2, RepHMS, [256, 2, 1, 3, 5]]          # 23

  # P3 -> P4
  - [21, 1, Conv, [256, 3, 2]]                   # 24
  - [23, 1, AVG, []]                             # 25
  - [[-1, -2, 17, 14], 1, Concat, [1]]          # 26
  - [-1, 2, RepHMS, [512, 2, 1, 3, 7]]          # 27

  # P4 -> P5
  - [17, 1, Conv, [512, 3, 2]]                   # 28
  - [27, 1, AVG, []]                             # 29
  - [[-1, -2, 13], 1, Concat, [1]]              # 30
  - [-1, 1, RepHMS, [512, 2, 1, 3, 9]]          # 31

  # Detection
  - [[23, 27, 31], 1, Detect, [nc]]             # 32